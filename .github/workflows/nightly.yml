name: Nightly

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  differential:
    name: differential fuzz vs Haskell oracle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fuzz /parse against oracle image
        env:
          DUCKLING_FUZZ_COUNT: "200"
          # Image is not published to GHCR; skip unless a self-hosted runner has it.
          REQUIRE_ORACLE: "0"
        run: tools/ci/nightly_fuzz.sh
