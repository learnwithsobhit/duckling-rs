[package]
name = "duckling-train"
description = "Naive Bayes classifier trainer (port of Duckling.Ranking.Train / Generate)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "duckling-train"
path = "src/main.rs"

[dependencies]
duckling = { path = "../duckling" }
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
