[package]
name = "duckling"
description = "Rust port of Meta's Duckling: parse text into structured entities (numbers, times, durations, ...)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["all-langs"]
all-langs = ["lang-af", "lang-ar", "lang-bg", "lang-bn", "lang-ca", "lang-cs", "lang-da", "lang-de", "lang-el", "lang-en", "lang-es", "lang-et", "lang-fa", "lang-fi", "lang-fr", "lang-ga", "lang-he", "lang-hi", "lang-hr", "lang-hu", "lang-id", "lang-is", "lang-it", "lang-ja", "lang-ka", "lang-km", "lang-kn", "lang-ko", "lang-lo", "lang-ml", "lang-mn", "lang-my", "lang-nb", "lang-ne", "lang-nl", "lang-pl", "lang-pt", "lang-ro", "lang-ru", "lang-sk", "lang-sv", "lang-sw", "lang-ta", "lang-te", "lang-th", "lang-tr", "lang-uk", "lang-vi", "lang-zh"]
lang-af = []
lang-ar = []
lang-bg = []
lang-bn = []
lang-ca = []
lang-cs = []
lang-da = []
lang-de = []
lang-el = []
lang-en = []
lang-es = []
lang-et = []
lang-fa = []
lang-fi = []
lang-fr = []
lang-ga = []
lang-he = []
lang-hi = []
lang-hr = []
lang-hu = []
lang-id = []
lang-is = []
lang-it = []
lang-ja = []
lang-ka = []
lang-km = []
lang-kn = []
lang-ko = []
lang-lo = []
lang-ml = []
lang-mn = []
lang-my = []
lang-nb = []
lang-ne = []
lang-nl = []
lang-pl = []
lang-pt = []
lang-ro = []
lang-ru = []
lang-sk = []
lang-sv = []
lang-sw = []
lang-ta = []
lang-te = []
lang-th = []
lang-tr = []
lang-uk = []
lang-vi = []
lang-zh = []

[dependencies]
fancy-regex = "0.14"
regex = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
unicode-general-category = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
once_cell = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[[bench]]
name = "expensive"
harness = false
