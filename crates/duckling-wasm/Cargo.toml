[package]
name = "duckling-wasm"
description = "WebAssembly bindings for the Rust port of Duckling"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Language support is opt-in so bundles only carry what they need.
default = ["lang-en"]
all-langs = ["duckling/all-langs"]
lang-af = ["duckling/lang-af"]
lang-ar = ["duckling/lang-ar"]
lang-bg = ["duckling/lang-bg"]
lang-bn = ["duckling/lang-bn"]
lang-ca = ["duckling/lang-ca"]
lang-cs = ["duckling/lang-cs"]
lang-da = ["duckling/lang-da"]
lang-de = ["duckling/lang-de"]
lang-el = ["duckling/lang-el"]
lang-en = ["duckling/lang-en"]
lang-es = ["duckling/lang-es"]
lang-et = ["duckling/lang-et"]
lang-fa = ["duckling/lang-fa"]
lang-fi = ["duckling/lang-fi"]
lang-fr = ["duckling/lang-fr"]
lang-ga = ["duckling/lang-ga"]
lang-he = ["duckling/lang-he"]
lang-hi = ["duckling/lang-hi"]
lang-hr = ["duckling/lang-hr"]
lang-hu = ["duckling/lang-hu"]
lang-id = ["duckling/lang-id"]
lang-is = ["duckling/lang-is"]
lang-it = ["duckling/lang-it"]
lang-ja = ["duckling/lang-ja"]
lang-ka = ["duckling/lang-ka"]
lang-kn = ["duckling/lang-kn"]
lang-km = ["duckling/lang-km"]
lang-ko = ["duckling/lang-ko"]
lang-lo = ["duckling/lang-lo"]
lang-ml = ["duckling/lang-ml"]
lang-mn = ["duckling/lang-mn"]
lang-my = ["duckling/lang-my"]
lang-nb = ["duckling/lang-nb"]
lang-ne = ["duckling/lang-ne"]
lang-nl = ["duckling/lang-nl"]
lang-pl = ["duckling/lang-pl"]
lang-pt = ["duckling/lang-pt"]
lang-ro = ["duckling/lang-ro"]
lang-ru = ["duckling/lang-ru"]
lang-sk = ["duckling/lang-sk"]
lang-sv = ["duckling/lang-sv"]
lang-sw = ["duckling/lang-sw"]
lang-ta = ["duckling/lang-ta"]
lang-te = ["duckling/lang-te"]
lang-th = ["duckling/lang-th"]
lang-tr = ["duckling/lang-tr"]
lang-uk = ["duckling/lang-uk"]
lang-vi = ["duckling/lang-vi"]
lang-zh = ["duckling/lang-zh"]

[dependencies]
duckling = { path = "../duckling", default-features = false }
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
